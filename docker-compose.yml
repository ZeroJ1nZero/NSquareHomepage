version: '3.8'

services:
  # 1. MariaDB (AuthServer DB)
  mariadb:
    image: mariadb:11.4
    container_name: nsquare-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password123!
      MYSQL_DATABASE: AuthServerDb
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - nsquare-network

  # 2. SQL Server (ResourceServer DB)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nsquare-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nsquare-network

  # 3. AuthServer (OIDC Identity Provider)
  authserver:
    build:
      context: ./AuthServer
      dockerfile: Dockerfile
    container_name: nsquare-authserver
    depends_on:
      - mariadb
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=mariadb;Port=3306;Database=AuthServerDb;User=root;Password=password123!;
    ports:
      - "7213:7213"
      - "5123:8080"
    networks:
      - nsquare-network

  # 4. ResourceServer (Data Resource API)
  resourceserver:
    build:
      context: ./ResourceServer
      dockerfile: Dockerfile
    container_name: nsquare-resourceserver
    depends_on:
      - sqlserver
      - authserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=NSquareResourceDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Authentication__Authority=https://authserver:7213
    ports:
      - "7002:7002"
      - "5002:8080"
    networks:
      - nsquare-network

  # 5. ServiceServer (BFF & Web Host)
  serviceserver:
    build:
      context: ./ServiceServer
      dockerfile: Dockerfile
    container_name: nsquare-serviceserver
    depends_on:
      - authserver
      - resourceserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Authentication__Authority=https://authserver:7213
      - ResourceServer__BaseUrl=https://resourceserver:7002
    ports:
      - "7001:7001"
      - "5001:8080"
    networks:
      - nsquare-network

networks:
  nsquare-network:
    driver: bridge

volumes:
  mariadb_data:
  sqlserver_data:
